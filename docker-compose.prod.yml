# Production. Run it with `make up:prod` (it reads .env.prod). Nothing here is published except ports 80 and 443.
name: ctrlcash-prod

services:
  # The front door: https (automatic certificate), the static web app and, under /api, the API.
  web:
    build:
      context: .
      dockerfile: docker/prod/Dockerfile
      args:
        SITE_URL: "${PUBLIC_URL:?PUBLIC_URL is empty, set your address in .env.prod}"
    image: ctrlcash-web:prod
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-${PUBLIC_URL}}
    # Behind a tunnel (TUNNEL_TOKEN set) the ports stay on this machine only and Caddy speaks plain http. The tunnel
    # reaches this container by name inside the Docker network, so the host ports are not even needed; they are moved
    # out of 80/443 so another project on the same server (its own tunnel, its own 80/443) never clashes with this one.
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # The API: checks the Firebase token on every request and keeps the data in PostgreSQL. No port is published.
  api:
    build:
      context: backend
    image: ctrlcash-api:prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgres://ctrlcash:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is empty, run make up:prod to generate it}@postgres:5432/ctrlcash"
      FIREBASE_PROJECT_ID: "${FIREBASE_PROJECT_ID:?FIREBASE_PROJECT_ID is empty, set it in .env.prod}"
      RUN_MIGRATIONS: "1"
      PUBLIC_URL: "${PUBLIC_URL:-}"
      SMTP_URL: "${SMTP_URL:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ctrlcash
      POSTGRES_USER: ctrlcash
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is empty, run make up:prod to generate it}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctrlcash -d ctrlcash"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Only with TUNNEL_TOKEN: a Cloudflare Tunnel that brings the public address to this machine, so no port has to be
  # opened on the router and a changing home IP does not matter.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      web:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
