    <style>
      /* The page is white: the top (status bar and notch area) matches the light header; the login screen
         switches it to its navy while it is shown (see AuthScreens). The app paints its own backgrounds. */
      html, body { height: 100%; background: #FFFFFF; }
      /* body is a column: the install banner (when shown) takes its height at the top and the app (#root)
         gets the rest, so the banner pushes the content down instead of covering it and the app height
         shrinks by exactly the banner height. */
      body { overflow: hidden; display: flex; flex-direction: column; }
      #root { display: flex; flex: 1 1 0; min-height: 0; box-sizing: border-box; padding-top: env(safe-area-inset-top); }
      /* the banner already sits under the notch/status bar area: the app does not add it twice */
      body.install-banner-on #root { padding-top: 0; }

      /* Install banner (phones on the web): one quiet line, light, close to the signed-in header */
      #install-banner {
        display: none; flex-shrink: 0; align-items: center; gap: 10px;
        padding: 0 12px; padding-top: env(safe-area-inset-top);
        min-height: 48px;
        background: #2D55D9; border-bottom: 1px solid transparent;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; font-size: 16px; line-height: 1.25;
      }
      /* on the sign-in screen the banner takes the color of the navy panel under it (and of the browser's top bar) */
      body.on-login #install-banner { background: #0B192C; border-bottom-color: transparent; }
      body.on-login #install-banner .ib-text { color: #9FB0CC; }
      body.on-login #install-banner .ib-name { color: #FFFFFF; }
      body.on-login #install-btn { background: rgba(255,255,255,0.12); color: #FFFFFF; }
      body.on-login #install-btn:active { background: rgba(255,255,255,0.22); }
      #install-banner img { width: 28px; height: 28px; border-radius: 7px; flex-shrink: 0; opacity: 0.9; }
      #install-banner .ib-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #DCE5FF; }
      #install-banner .ib-name { font-weight: 600; color: #FFFFFF; }
      #install-banner button { font: inherit; border: 0; cursor: pointer; background: none; }
      /* looks like a button (soft accent fill, not a loud solid one); the 44px target comes from the banner height */
      #install-btn { min-height: 40px; padding: 0 16px; border-radius: 10px; background: rgba(255,255,255,0.18); color: #FFFFFF; font-weight: 600; }
      #install-btn:active { background: rgba(255,255,255,0.28); }
      /* iPhone guide dialog */
      #ios-guide { display: none; position: fixed; inset: 0; z-index: 99999; align-items: center; justify-content: center; font-family: Inter, system-ui, -apple-system, sans-serif; }
      #ios-guide .bg { position: absolute; inset: 0; background: rgba(11,25,44,0.45); }
      #ios-guide .card { position: relative; width: calc(100% - 40px); max-width: 360px; background: #fff; border-radius: 24px; padding: 28px 24px 20px; color: #0F1B33; font-size: 16px; line-height: 1.4; box-shadow: 0 20px 50px rgba(11,25,44,0.3); }
      #ios-guide h2 { margin: 12px 0 16px; font-size: 20px; }
      #ios-guide .step { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 14px; color: #0F1B33; }
      #ios-guide .num { flex-shrink: 0; width: 26px; height: 26px; border-radius: 13px; background: #2D55D9; color: #fff; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
      #ios-guide .muted { color: #66728C; }
      #ios-guide svg { vertical-align: -4px; }
      #ios-ok { width: 100%; min-height: 48px; margin-top: 6px; border: 0; border-radius: 14px; background: #2D55D9; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }

      /* Autofill must not repaint the fields: the browser's blue/yellow background never shows, the
         field keeps the designed look (the wrapper draws the background). */
      input:-webkit-autofill,
      input:-webkit-autofill:hover,
      input:-webkit-autofill:focus,
      input:-webkit-autofill:active {
        -webkit-text-fill-color: #0F1B33;
        caret-color: #0F1B33;
        transition: background-color 600000s 0s, color 600000s 0s;
      }
      input:autofill {
        background-color: transparent !important;
        color: #0F1B33 !important;
        filter: none !important;
      }
      /* Harmonious scrollbars everywhere (the page and every scrollable box).
         IMPORTANT: Chrome ignores every ::-webkit-scrollbar rule if `scrollbar-color` or `scrollbar-width`
         is set on the same element, so those two only apply where ::-webkit-scrollbar does not exist (Firefox). */
      @supports not selector(::-webkit-scrollbar) {
        * { scrollbar-width: thin; scrollbar-color: rgba(15,27,51,0.28) transparent; }
      }
      ::-webkit-scrollbar { width: 14px; height: 14px; }
      ::-webkit-scrollbar-track { background: transparent; }
      /* a slim pill (6px visible inside a 14px hit area), faint at rest, firmer when its box is hovered,
         in the brand color under the pointer and when dragged */
      ::-webkit-scrollbar-thumb {
        background-color: rgba(15,27,51,0.16);
        border: 4px solid transparent;
        background-clip: padding-box;
        border-radius: 999px;
        min-height: 48px;
        min-width: 48px;
      }
      :hover::-webkit-scrollbar-thumb { background-color: rgba(15,27,51,0.30); }
      ::-webkit-scrollbar-thumb:hover { background-color: rgba(45,85,217,0.60); }
      ::-webkit-scrollbar-thumb:active { background-color: rgba(45,85,217,0.85); }
      ::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
      ::-webkit-scrollbar-corner { background: transparent; }
    </style>

    <noscript>
      <main style="font-family:system-ui,sans-serif;max-width:720px;margin:48px auto;padding:0 24px;color:#0F1B33">
        <h1>Ctrl+Cash: control your money, project your net worth</h1>
        <p>Ctrl+Cash is a personal finance app built on one rule: what is left over in a month is wealth, and a credit card is debt, not extra income. It requires JavaScript to run.</p>
        <h2>Net worth projection</h2>
        <p>See how your net worth evolves over 6, 12 or 24 months: a planned line, from what is already registered, and a historical line that also subtracts your typical one-off spending of the last 3 months.</p>
        <h2>Cards as debt</h2>
        <p>Track what you owe, which statement it falls on, your installments and payments, and how the debt shrinks month by month. It is subtracted from your net worth.</p>
        <h2>A financial health score you can read</h2>
        <p>A score from 0 to 1000 built from your cushion in months of expenses, your debt and the quality of your spending, with a plain-language list of what is pulling it down and what is pushing it up.</p>
        <h2>Financial freedom</h2>
        <p>Find out how many months your net worth would cover your expenses if you stopped working today.</p>
        <h2>Ctrl+Cash vs. ordinary expense trackers</h2>
        <p>Trackers record the past. Ctrl+Cash projects the future. It is open source, and nothing you register is ever deleted, only archived.</p>
      </main>
    </noscript>
    <!-- Install banner: outside React, before #root (body is a flex column, so it pushes the app down) -->
    <div id="install-banner">
      <img src="/icon-192.png" alt="" />
      <div class="ib-text"><span class="ib-name">Ctrl+Cash</span></div>
      <button id="install-btn" type="button">Install</button>
    </div>
    <!-- iPhone: Safari cannot install from a button, so this is a step by step guide -->
    <div id="ios-guide" role="dialog" aria-modal="true" aria-label="Add to Home Screen">
      <div class="bg" id="ios-bg"></div>
      <div class="card">
        <img src="/icon-192.png" width="56" height="56" alt="" style="border-radius:14px" />
        <h2>Add to Home Screen</h2>
        <div class="step"><span class="num">1</span><span>Tap <b>Share</b>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2D55D9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M5 11v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"/></svg>
          in Safari's toolbar<br /><span class="muted">If you do not see it, tap <b>&bull;&bull;&bull;</b> first.</span></span></div>
        <div class="step"><span class="num">2</span><span>Scroll and tap <b>Add to Home Screen</b></span></div>
        <div class="step"><span class="num">3</span><span>Tap <b>Add</b> at the top</span></div>
        <button id="ios-ok" type="button">Got it</button>
      </div>
    </div>
    <script>
      (function () {
        var ua = navigator.userAgent;
        var isIOS = /iPhone|iPod/i.test(ua);
        var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone;
        // in the browser only (not in the installed app); phones and computers alike
        if (standalone) return;

        var banner = document.getElementById('install-banner');
        var deferred = null;
        // computers have room for a card inside the app instead of a bar: the app reads this (window.ctrlInstall)
        function isDesktop() { return window.matchMedia && window.matchMedia('(min-width: 900px)').matches; }
        window.ctrlInstall = {
          ready: false,
          run: function () {
            if (!deferred) return;
            deferred.prompt();
            deferred.userChoice.then(function () { deferred = null; hide(); });
          }
        };
        // the browser's top bar follows the banner (blue while it is there, white without it)
        function setBar(color) { var m = document.querySelector('meta[name="theme-color"]'); if (m && !document.body.classList.contains('on-login')) m.setAttribute('content', color); }
        function setReady(v) { window.ctrlInstall.ready = v; window.dispatchEvent(new Event('installready')); }
        // the React app listens to this to re-measure its height (it shrinks by the banner height)
        function notify() { window.dispatchEvent(new Event('installbanner')); }
        function show() {
          if (isDesktop()) { setReady(true); return; }
          banner.style.display = 'flex';
          setBar('#2D55D9');
          document.body.classList.add('install-banner-on');
          notify();
        }
        function hide() {
          setReady(false);
          setBar('#FFFFFF');
          banner.style.display = 'none';
          document.body.classList.remove('install-banner-on');
          notify();
        }

        if (!isIOS) {
          // Chrome and Edge (Android and computers): the install prompt is only available after this event
          window.addEventListener('beforeinstallprompt', function (e) {
            e.preventDefault();
            deferred = e;
            show();
          });
          document.getElementById('install-btn').addEventListener('click', window.ctrlInstall.run);
        } else {
          // iPhone (Safari): no direct install, the button opens the step by step guide
          var guide = document.getElementById('ios-guide');
          function closeGuide() { guide.style.display = 'none'; }
          document.getElementById('ios-bg').addEventListener('click', closeGuide);
          document.getElementById('ios-ok').addEventListener('click', closeGuide);
          document.getElementById('install-btn').addEventListener('click', function () { guide.style.display = 'flex'; });
          show();
        }
        window.addEventListener('appinstalled', hide);
      })();
    </script>
    <div id="root"></div>
